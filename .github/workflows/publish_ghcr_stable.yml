name: Build Docker image (GHCR stable)

on:
  push:
    branches:
      - nogara/stable
    tags:
      - "stable-*"
  schedule:
    - cron: '0 6 * * 1' # Weekly rebuild to pick up Alpine package updates
  workflow_dispatch:

jobs:
  build_deploy:
    name: Build and Deploy
    if: github.repository_owner == 'nogara'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/evolution-api
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'nogara/stable' || github.ref }}
          submodules: recursive

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref_type != 'tag' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify Node.js version per platform
        env:
          INDEX_DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          expected="v$(grep -m1 -oE '^FROM node:[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | sed 's/^FROM node://')"
          for arch in amd64 arm64; do
            digest=$(docker buildx imagetools inspect "${IMAGE}@${INDEX_DIGEST}" \
              --format "{{range .Manifest.Manifests}}{{if eq .Platform.Architecture \"${arch}\"}}{{.Digest}}{{end}}{{end}}")
            test -n "$digest"
            actual=$(docker run --rm --platform "linux/${arch}" --entrypoint node "${IMAGE}@${digest}" -v)
            echo "linux/${arch} ${digest}: expected=${expected} actual=${actual}"
            test "$actual" = "$expected"
          done

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
